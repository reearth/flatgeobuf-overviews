[package]
name = "fgbo"
description = "FlatGeobuf Overviews (FGBO) — scale-optimized FlatGeobuf-compatible format: encoder, decoder, and tiling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flatgeobuf = { workspace = true }
geozero = { workspace = true }
geo-types = { workspace = true }
geo = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
tempfile = { version = "3", optional = true }
ureq = { version = "3", optional = true }

[features]
default = ["writer"]
# encoder support (uses temp files; not available on wasm)
writer = ["dep:tempfile"]
http = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"
