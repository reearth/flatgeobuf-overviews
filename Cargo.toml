[workspace]
members = ["crates/fgbo", "crates/fgbo-cli", "crates/fgbo-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/flatgeobuf-overviews"

[workspace.dependencies]
flatgeobuf = { version = "6.0", default-features = false }
geozero = { version = "0.15", features = ["with-mvt"] }
geo-types = "0.7"
geo = "0.30"
thiserror = "2"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
